{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="col-md-10 col-lg-8">

        <div class="card p-5 shadow-lg" style="border-top: 5px solid #BF953F !important; border-radius: 25px;">

            <div class="text-center mb-5">
                <h1 class="fw-bolder display-5">Create New Listing</h1>
                <div style="height: 3px; width: 80px; background: linear-gradient(to right, transparent, #BF953F, transparent); margin: 20px auto;"></div>
                <p class="text-secondary fs-5">Share your exclusive content with the world.</p>
            </div>

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-5 p-5 border border-3 border-dashed rounded-4 text-center position-relative"
                     style="border-color: rgba(191, 149, 63, 0.3) !important; background: rgba(0,0,0,0.25); transition: all 0.3s ease;">

                    <div class="mb-4">
                         <i class="fas fa-cloud-upload-alt" style="font-size: 5rem; color: #BF953F; filter: drop-shadow(0 0 10px rgba(191,149,63,0.5));"></i>
                    </div>

                    <h3 class="text-white mb-3 fw-bold">Drag and Drop file</h3>
                    <p class="text-muted fs-5 mb-4">High-resolution JPG, PNG accepted.</p>

                    <input type="file" name="photo" class="form-control form-control-lg mx-auto w-75 border-warning" style="background: rgba(0,0,0,0.5);" required>
                </div>

                <div class="row g-4">
                    <div class="col-12">
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-transparent border-secondary text-warning p-3">
                                <i class="fas fa-heading fs-4"></i>
                            </span>
                            <input type="text" name="title" class="form-control form-control-lg py-3 fs-5" placeholder="Enter a catchy title..." required>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-transparent border-secondary text-warning p-3 align-items-start pt-4">
                                <i class="fas fa-quote-left fs-4"></i>
                            </span>
                            <textarea name="caption" class="form-control form-control-lg py-3 fs-5" rows="4" placeholder="Tell the story behind this masterpiece..."></textarea>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-transparent border-secondary text-warning p-3">
                                <i class="fas fa-map-marker-alt fs-5"></i>
                            </span>
                            <input type="text" name="location" class="form-control form-control-lg py-3" placeholder="Add Location">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-transparent border-secondary text-warning p-3">
                                <i class="fas fa-tags fs-5"></i>
                            </span>
                            <input type="text" name="people" class="form-control form-control-lg py-3" placeholder="Tag People (@)">
                        </div>
                    </div>
                </div>

                <div class="mt-5">
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-4 fs-4 text-uppercase" style="letter-spacing: 2px;">
                        <i class="fas fa-paper-plane me-3"></i> Publish Now
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
